[project]
name = "saved-messages"
version = "0.1.0"
description = "A private web application for organizing Telegram Saved Messages with a local LLM."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "cryptography>=45.0.7",
    "datastar-py>=0.6.0",
    "email-validator>=2.3.0",
    "fastapi>=0.116.1",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.10.1",
    "python-socks[asyncio]>=2.7.1",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.43",
    "taskiq>=0.11.18",
    "taskiq-redis>=1.0.3",
    "telethon>=1.40.0",
    "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saved_messages"]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3.16"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-socks[asyncio]>=3.1.1",
    "ruff>=0.13.0",
    "websockets>=17.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
