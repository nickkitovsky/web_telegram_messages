services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saved_messages
      POSTGRES_USER: saved_messages
      POSTGRES_PASSWORD: saved_messages
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saved_messages -d saved_messages"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
